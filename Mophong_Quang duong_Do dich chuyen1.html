<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân biệt Quãng đường và Độ dịch chuyển - Thầy Dinh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #2c3e50; text-transform: uppercase; }
        canvas {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 15px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #3498db;
            cursor: pointer;
        }
        button {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #2980b9; }
        button#resetBtn { background-color: #e74c3c; border-color: #c0392b; }
        button#resetBtn:hover { background-color: #c0392b; }
        
        .dashboard {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .metric {
            text-align: center;
            font-size: 16px;
            color: #7f8c8d;
        }
        .metric span {
            display: block;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 5px;
        }
        .highlight-s span { color: #27ae60; } 
        .highlight-d span { color: #e67e22; } 
    </style>
</head>
<body>

    <h2>PHÂN BIỆT QUÃNG ĐƯỜNG VÀ ĐỘ DỊCH CHUYỂN</h2>

    <div class="controls">
        <select id="pathSelect">
            <option value="straight">Đường thẳng</option>
            <option value="curve">Đường cong</option>
            <option value="zigzag">Đường gấp khúc</option>
            <option value="circle">Đường khép kín (Tròn)</option>
            <option value="map">Bản đồ: 4 Đặng Dung -> THPT B Nguyễn Huệ</option>
        </select>
        <button id="startBtn">Bắt đầu</button>
        <button id="resetBtn">Làm mới</button>
    </div>

    <div class="dashboard">
        <div class="metric">Thời gian (t) <span id="valT">0.0s</span></div>
        <div class="metric highlight-s">Quãng đường (s) <span id="valS">0px</span></div>
        <div class="metric highlight-d">Độ dịch chuyển (d) <span id="valD">0px</span></div>
        <div class="metric highlight-s">Tốc độ (s/t) <span id="valSpeed">0.0</span></div>
        <div class="metric highlight-d">Vận tốc (d/t) <span id="valVelocity">0.0</span></div>
    </div>

    <canvas id="simCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const pathSelect = document.getElementById('pathSelect');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        const valT = document.getElementById('valT');
        const valS = document.getElementById('valS');
        const valD = document.getElementById('valD');
        const valSpeed = document.getElementById('valSpeed');
        const valVelocity = document.getElementById('valVelocity');

        let isRunning = false;
        let animationId;
        
        let t = 0;
        let s = 0; 
        let d = 0; 
        
        let startX, startY, currentX, currentY;
        let history = []; 
        let pathPoints = []; 
        let pathIndex = 0;
        const speedPxPerFrame = 2.5; 

        function drawRoundedRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        function generateStraight() {
            let pts = [];
            for (let x = 100; x <= 700; x += speedPxPerFrame) {
                pts.push({ x: x, y: 200 });
            }
            return pts;
        }

        function generateRandomCurve() {
            let pts = [];
            let p0 = { x: 100, y: 200 };
            let p3 = { x: 700, y: 200 };
            
            let p1 = { x: 200 + Math.random() * 100, y: 20 + Math.random() * 40 }; 
            let p2 = { x: 450 + Math.random() * 100, y: 340 + Math.random() * 40 };

            let densePts = [];
            for (let t = 0; t <= 1; t += 0.001) {
                let u = 1 - t;
                let x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;
                let y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;
                densePts.push({ x, y });
            }
            
            pts.push(densePts[0]);
            let lastPt = densePts[0];
            for (let i = 1; i < densePts.length; i++) {
                let dx = densePts[i].x - lastPt.x;
                let dy = densePts[i].y - lastPt.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist >= speedPxPerFrame) {
                    pts.push(densePts[i]);
                    lastPt = densePts[i];
                }
            }
            pts.push(p3); 
            return pts;
        }

        function generateZigzag() {
            let waypoints = [
                {x: 100, y: 200},
                {x: 250, y: 50},   
                {x: 400, y: 350},  
                {x: 550, y: 80},   
                {x: 700, y: 200}   
            ];
            let pts = [];
            
            for (let i = 0; i < waypoints.length - 1; i++) {
                let pStart = waypoints[i];
                let pEnd = waypoints[i+1];
                let dx = pEnd.x - pStart.x;
                let dy = pEnd.y - pStart.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let steps = dist / speedPxPerFrame;
                
                for (let j = 0; j < steps; j++) {
                    pts.push({
                        x: pStart.x + (dx * j / steps),
                        y: pStart.y + (dy * j / steps)
                    });
                }
            }
            pts.push(waypoints[waypoints.length - 1]);
            return pts;
        }

        function generateCircle() {
            let pts = [];
            let radius = 130;
            let cx = 400, cy = 200;
            let step = speedPxPerFrame / radius; 
            for (let angle = -Math.PI/2; angle <= 1.5 * Math.PI; angle += step) {
                pts.push({ x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) });
            }
            pts.push({ x: cx + radius * Math.cos(-Math.PI/2), y: cy + radius * Math.sin(-Math.PI/2) });
            return pts;
        }

        function generateMapRoute() {
            let waypoints = [
                {x: 150, y: 320}, // 4 Đặng Dung
                {x: 150, y: 100}, // Ngã tư
                {x: 450, y: 100}, // Ngã tư
                {x: 450, y: 220}, // Vào Nguyễn Văn Trỗi
                {x: 650, y: 220}  // 39 Nguyễn Văn Trỗi
            ];
            let pts = [];
            
            for (let i = 0; i < waypoints.length - 1; i++) {
                let pStart = waypoints[i];
                let pEnd = waypoints[i+1];
                let dx = pEnd.x - pStart.x;
                let dy = pEnd.y - pStart.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let steps = dist / speedPxPerFrame;
                
                for (let j = 0; j < steps; j++) {
                    pts.push({
                        x: pStart.x + (dx * j / steps),
                        y: pStart.y + (dy * j / steps)
                    });
                }
            }
            pts.push(waypoints[waypoints.length - 1]);
            return pts;
        }

        function initVars() {
            t = 0; s = 0; d = 0; history = []; pathIndex = 0;
            const pathType = pathSelect.value;
            
            if (pathType === 'straight') pathPoints = generateStraight();
            else if (pathType === 'curve') pathPoints = generateRandomCurve();
            else if (pathType === 'zigzag') pathPoints = generateZigzag();
            else if (pathType === 'circle') pathPoints = generateCircle();
            else if (pathType === 'map') pathPoints = generateMapRoute();
            
            startX = pathPoints[0].x;
            startY = pathPoints[0].y;
            currentX = startX; 
            currentY = startY;
            
            history.push({x: currentX, y: currentY});
            updateDashboard();
            draw();
        }

        function drawArrow(fromx, fromy, tox, toy) {
            let headlen = 15; 
            let dx = tox - fromx;
            let dy = toy - fromy;
            let angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.strokeStyle = '#e67e22'; 
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = '#e67e22';
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // NỀN BẢN ĐỒ THỰC TẾ
            if (pathSelect.value === 'map') {
                // Tuyến đường (nét to)
                ctx.beginPath();
                ctx.moveTo(150, 360); ctx.lineTo(150, 100); 
                ctx.lineTo(450, 100);
                ctx.lineTo(450, 220);
                ctx.lineTo(750, 220);
                ctx.strokeStyle = '#e0e4e8'; 
                ctx.lineWidth = 26;
                ctx.lineCap = 'butt';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                // Tên đường
                ctx.fillStyle = '#95a5a6';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = "center";
                
                ctx.save();
                ctx.translate(130, 220);
                ctx.rotate(-Math.PI/2);
                ctx.fillText("Đường Đặng Dung", 0, 0);
                ctx.restore();
                
                ctx.fillText("Đường Nguyễn Văn Trỗi", 560, 205);
                
                // Điểm đích (Trường học)
                let endX = 650; let endY = 220;
                ctx.beginPath();
                ctx.arc(endX, endY, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#27ae60'; 
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.textAlign = "center";
                ctx.fillStyle = "#27ae60";
                ctx.font = "bold 14px Arial";
                ctx.fillText("THPT B Nguyễn Huệ", endX, endY - 15);
                
                ctx.textAlign = "left"; // reset
            }

            // Vẽ đường định hướng mờ (ẩn đi nếu đang chọn bản đồ)
            if (pathPoints.length > 0 && pathSelect.value !== 'map') {
                ctx.beginPath();
                ctx.setLineDash([8, 8]); 
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (let i = 1; i < pathPoints.length; i++) {
                    ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                }
                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]); 
            }

            // Vẽ vết quãng đường 
            ctx.beginPath();
            ctx.moveTo(history[0].x, history[0].y);
            for (let i = 1; i < history.length; i++) {
                ctx.lineTo(history[i].x, history[i].y);
            }
            ctx.strokeStyle = 'rgba(39, 174, 96, 0.6)';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Vẽ Véctơ độ dịch chuyển 
            if (history.length > 1 && d > 1) { 
                drawArrow(startX, startY, currentX, currentY);
            }

            // Vẽ vật thể
            ctx.beginPath();
            ctx.arc(currentX, currentY, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#2980b9';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Vẽ điểm xuất phát
            ctx.beginPath();
            ctx.arc(startX, startY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#c0392b';
            ctx.fill();
            
            // Ghi chú điểm xuất phát
            ctx.textAlign = "left";
            ctx.fillStyle = "#333";
            ctx.font = "14px Arial";
            if (pathSelect.value === 'map') {
                ctx.fillText("4 Đặng Dung", startX + 15, startY + 5);
            } else {
                ctx.fillText("Xuất phát", startX - 30, startY + 25);
            }

            // Thẻ Badge BẢN QUYỀN bắt mắt
            let cardW = 320;
            let cardH = 85;
            let cardX = canvas.width - cardW - 15;
            let cardY = canvas.height - cardH - 15;

            ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 8, true, false);

            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.fillStyle = "#2980b9"; 
            ctx.beginPath();
            ctx.moveTo(cardX, cardY + 8);
            ctx.quadraticCurveTo(cardX, cardY, cardX + 8, cardY);
            ctx.lineTo(cardX + 8, cardY);
            ctx.lineTo(cardX + 8, cardY + cardH);
            ctx.lineTo(cardX, cardY + cardH);
            ctx.quadraticCurveTo(cardX, cardY + cardH, cardX, cardY + cardH - 8);
            ctx.closePath();
            ctx.fill();

            ctx.textAlign = "left";

            ctx.fillStyle = "#e74c3c"; 
            ctx.font = "bold 16px Arial";
            ctx.fillText("VẬT LÝ THẦY DINH", cardX + 20, cardY + 25);

            ctx.fillStyle = "#2c3e50";
            ctx.font = "13px Arial";
            ctx.fillText("☎ Điện thoại: ", cardX + 20, cardY + 48);
            ctx.fillStyle = "#2980b9"; 
            ctx.font = "bold 13px Arial";
            ctx.fillText("0946007638", cardX + 105, cardY + 48);

            ctx.fillStyle = "#27ae60"; 
            ctx.font = "italic bold 12px Arial";
            ctx.fillText("Trường THPT B Nguyễn Huệ - Nam Định", cardX + 20, cardY + 70);
        }

        function updateDashboard() {
            valT.innerText = (t / 60).toFixed(1) + "s";
            valS.innerText = s.toFixed(0) + "px";
            valD.innerText = d.toFixed(0) + "px";
            
            let timeSec = t / 60;
            if (timeSec > 0) {
                valSpeed.innerText = (s / timeSec).toFixed(1);
                valVelocity.innerText = (d / timeSec).toFixed(1);
            } else {
                valSpeed.innerText = "0.0";
                valVelocity.innerText = "0.0";
            }
        }

        function loop() {
            if (!isRunning) return;

            if (pathIndex < pathPoints.length - 1) {
                pathIndex++;
                currentX = pathPoints[pathIndex].x;
                currentY = pathPoints[pathIndex].y;

                let lastPos = history[history.length - 1];
                let dx = currentX - lastPos.x;
                let dy = currentY - lastPos.y;
                s += Math.sqrt(dx*dx + dy*dy);
                
                let diffX = currentX - startX;
                let diffY = currentY - startY;
                d = Math.sqrt(diffX*diffX + diffY*diffY);

                history.push({x: currentX, y: currentY});
                t++;
            } else {
                isRunning = false;
                startBtn.innerText = "Bắt đầu";
                if (pathSelect.value === 'circle') d = 0; 
            }

            draw();
            updateDashboard();

            if (isRunning) {
                animationId = requestAnimationFrame(loop);
            }
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                startBtn.innerText = "Tiếp tục";
                cancelAnimationFrame(animationId);
            } else {
                if (pathIndex >= pathPoints.length - 1) initVars(); 
                isRunning = true;
                startBtn.innerText = "Tạm dừng";
                loop();
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            startBtn.innerText = "Bắt đầu";
            cancelAnimationFrame(animationId);
            initVars();
        });

        pathSelect.addEventListener('change', () => {
            isRunning = false;
            startBtn.innerText = "Bắt đầu";
            cancelAnimationFrame(animationId);
            initVars();
        });

        initVars();
    </script>
</body>
</html>
