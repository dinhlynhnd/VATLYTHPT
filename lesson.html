<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a35"><title>Vật lí THPT • Bài học</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f7fb}.top{height:48px;background:#071a35;color:white;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:12px}.top a{color:#fff;text-decoration:none;font-weight:800}.top span{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{width:100%;height:calc(100% - 48px);border:0;background:#fff}.loading{height:calc(100% - 48px);display:grid;place-items:center;color:#52677e;padding:24px;text-align:center}@media(max-width:600px){.top{height:42px;padding:0 9px;font-size:11px}.frame,.loading{height:calc(100% - 42px)}}</style></head><body><div class="top"><a href="/">← VẬT LÍ THPT</a><span id="title">Đang mở bài học…</span></div><div id="loading" class="loading">Đang tải nội dung bài học…</div><iframe id="frame" class="frame" style="display:none" allowfullscreen></iframe><script>
const q=new URLSearchParams(location.search),id=q.get('id'),frame=document.getElementById('frame'),loading=document.getElementById('loading');async function load(){if(!id){loading.textContent='Thiếu mã bài học.';return}try{const r=await fetch('/api/lesson?lesson_id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Không tìm thấy bài học');document.getElementById('title').textContent=d.title||id;document.title=(d.title||'Bài học')+' • Vật lí THPT';const u=(d.storage_url||'')+(location.hash||'');if(!u)throw new Error('Bài chưa được xuất bản');frame.src=u;frame.style.display='block';loading.style.display='none'}catch(e){loading.textContent='Không mở được bài học: '+e.message}}window.addEventListener('hashchange',()=>{if(frame.src){const u=new URL(frame.src);u.hash=location.hash;frame.src=u.toString()}});load();
</script></body></html>
