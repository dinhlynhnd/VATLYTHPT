<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài luyện • Vật lí THPT</title><style>:root{--blue:#1268e8;--navy:#071a35;--ink:#15233a;--muted:#6b788c;--line:#dfe7f1}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f4f7fb}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.top{background:var(--navy);color:#fff;padding:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.q h3{font-size:15px;line-height:1.55}.opt{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:7px 0;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:850}.muted{color:var(--muted);font-size:12px}.feedback{padding:9px 11px;border-radius:9px;background:#eef6ff;margin-top:8px;font-size:12px;display:none}.back{color:#fff;text-decoration:none}</style></head><body><header class="top"><div class="wrap"><a class="back" href="/">← Trang chủ</a><h2 id="pageTitle">Bài luyện cá nhân hóa</h2><div id="meta" class="muted" style="color:#b8cae0"></div></div></header><main class="wrap" id="app"></main><script src="/config/site-config.js"></script><script>
const CFG=window.VATLYTHPT_CONFIG||{};
const data=JSON.parse(sessionStorage.getItem('vatlythpt_practice_session')||'null');const app=document.getElementById('app');if(!data||!Array.isArray(data.questions)){app.innerHTML='<div class="card">Chưa có phiên luyện tập. Hãy tạo bài từ trang bài học hoặc hồ sơ học sinh.</div>'}else{meta.textContent=`Nguồn: ${data.source||'auto'} • ${data.questions.length} câu`;app.innerHTML=data.questions.map((q,i)=>`<div class="card q" data-i="${i}"><div class="muted">Câu ${i+1} • ${q.level||''} • ${q.skill||q.topic||''}</div><h3>${q.stem}</h3>${(q.options||[]).map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${'ABCD'[j]||j}"> ${'ABCD'[j]||j}. ${o}</label>`).join('')}<div class="feedback" id="fb${i}"></div></div>`).join('')+'<div class="card"><button class="btn" onclick="finish()">Hoàn thành</button><div id="score" style="margin-top:10px"></div></div>'}
async function finish(){let right=0,gradable=0;const attempts=[];data.questions.forEach((q,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const fb=document.getElementById('fb'+i);if(q.answer){gradable++;const ok=!!(sel&&String(sel.value).toUpperCase()===String(q.answer).trim().toUpperCase());if(ok)right++;fb.style.display='block';fb.textContent=(ok?'Đúng. ':'Chưa đúng. ')+(q.solution||'');attempts.push({question_uid:q.question_uid||q.id||('local-'+i),family_id:q.family_id||'',lesson_id:data.lessonId||'',topic:q.topic||'',skill:q.skill||'',level:q.level||'',source:data.source||q.source||'practice',is_correct:ok,score:ok?1:0,response:{selected:sel?sel.value:null}})}});document.getElementById('score').textContent=gradable?`Kết quả: ${right}/${gradable} câu có đáp án chấm tự động.`:'Phiên này chưa có đáp án chấm tự động.';try{const token=sessionStorage.getItem('vatlythpt_supabase_access_token');if(token&&CFG.supabaseUrl&&CFG.supabasePublishableKey&&attempts.length){await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/question_attempts',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.supabasePublishableKey,'Authorization':'Bearer '+token,'Prefer':'return=minimal'},body:JSON.stringify(attempts)})}}catch(e){console.warn('Không lưu được lịch sử:',e)}}
</script></body></html>
